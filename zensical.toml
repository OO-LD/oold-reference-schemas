[project]
site_name = "OO-LD Reference Schemas"
repo_url = "https://github.com/OO-LD/oold-reference-schemas"
site_url = "https://schemas.oo-ld.org/"
site_description = "Modular, ontology-mapped reference schemas in OO-LD for science and materials science and engineering"
site_author = "OO-LD Contributors"
edit_uri = "edit/main/docs/"
repo_name = "OO-LD/oold-reference-schemas"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/mapping-sets.js", "javascripts/module-version.js"]
copyright = 'Maintained by <a href="https://github.com/OO-LD">OO-LD</a> and <a href="https://materialscommons.eu/">MaterialsCommons</a>.'

nav = [
    { "Home" = "index.md" },
    # Two audiences, kept apart on purpose: "How it works" walks a reader through the
    # four example schemas, "Contributing" tells someone changing them where to edit and
    # how versions are set.
    { "How it works" = "how-it-works.md" },
    # Generated by scripts/build_pages.py from the schemas: a subschema sits under the
    # schema it extends, because that is how it inherits terms and mappings. Edit the
    # schemas, not this block.
    # BEGIN generated nav
    { "Modules" = [
        { "Overview" = "modules/index.md" },
        { "Quantities" = [
            { "QuantityValue" = [
                "modules/quantities/quantityvalue/index.md",
                { "Length" = [
                    "modules/quantities/quantityvalue/length/index.md",
                    { "Diameter" = "modules/quantities/quantityvalue/length/diameter/index.md" },
                ]},
                { "Time" = "modules/quantities/quantityvalue/time/index.md" },
            ]},
        ]},
    ]},
    { "Mapping sets" = [
        { "Overview" = "mapping-sets.md" },
        { "Consensus" = "mappings/consensus/index.md" },
        { "EMMO" = "mappings/emmo/index.md" },
        { "PMDco" = "mappings/pmdco/index.md" },
        { "schema.org" = "mappings/schemaorg/index.md" },
        { "Crosswalks" = "mappings/crosswalks/index.md" },
    ]},
    # END generated nav
    { "Reference" = [
        { "Versions and identifiers" = "versioning.md" },
        { "Conformance" = "conformance.md" },
        { "Pinned ontologies" = "ontologies.md" },
    ]},
    { "Contributing" = "contributing.md" },
]

[project.extra]
version = { provider = "mike" }

[project.theme]
language = "en"
name = "material"
features = [
    "navigation.indexes",
    "navigation.sections",
    "navigation.top",
    "content.code.copy",
    "content.action.edit",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[project.markdown_extensions]
"admonition" = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.highlight" = { anchor_linenums = true }
"attr_list" = {}
"md_in_html" = {}
"tables" = {}
"toc" = { permalink = true }

# Jinja2 macros (scripts/macros.py): a schema page embeds the schema file itself, rendered as
# JSON / "View as YAML" tabs, so documentation and schema cannot drift apart.
[project.markdown_extensions.zensical.extensions.macros]
module_name = "scripts/macros"
