[project.extra]
version = { provider = "mike" }

[project.theme]
language = "en"
name = "material"
features = [
    "navigation.indexes",
    "navigation.sections",
    "navigation.top",
    "content.code.copy",
    "content.action.edit",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[project.markdown_extensions]
"admonition" = {}
"pymdownx.details" = {}
"pymdownx.superfences" = { custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }] }
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.highlight" = { anchor_linenums = true }
"attr_list" = {}
"md_in_html" = {}
"tables" = {}
"toc" = { permalink = true }

# Jinja2 macros (scripts/macros.py): a schema page embeds the schema file itself, rendered as
# JSON / "View as YAML" tabs, so documentation and schema cannot drift apart.
[project.markdown_extensions.zensical.extensions.macros]
module_name = "scripts/macros"
